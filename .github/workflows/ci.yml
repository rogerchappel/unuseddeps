name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run audit:all
      - run: npm run audit:prod
      - run: npm test
      - run: npm run test:coverage
      - run: npm run check
      - run: npm run build
      - run: npm run smoke
      - run: npm run package:smoke
      - run: npm run package:consumer
